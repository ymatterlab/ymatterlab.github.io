<header class="site-header">
<div class="container header-inner">
<a aria-label="{{ site.Params.lab_name }} home" class="site-brand" href="{{ site.Data.copy.partials_header.path_ | relURL }}">
<img alt="{{ site.Params.lab_name }}" src="{{ site.Data.copy.partials_header.path_images_logo_ymatterlab_log_v5_svg | relURL }}"/>
</a>
<nav aria-label="Main">
<ul class="nav-list">
        {{ $current := $.RelPermalink }}
        {{ range site.Menus.main }}
          {{ $url := .URL | relURL }}
          {{ $exact := eq $current $url }}
          {{ $inSection := and (ne .URL "/") (hasPrefix $current $url) }}
          <li><a href="{{ $url }}"{{ if $exact }} aria-current="page"{{ else if $inSection }} aria-current="true"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
</nav>
</div>
</header>
