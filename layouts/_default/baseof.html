<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>{{ if .Title }}{{ .Title }} | {{ end }}{{ site.Title }}</title>
<link href="{{ site.Data.copy._default_baseof.copy_href_images_favicon_apple_touch_icon_png }}" rel="apple-touch-icon" sizes="180x180"/>
<link href="{{ site.Data.copy._default_baseof.copy_href_images_favicon_favicon_32x32_png }}" rel="icon" sizes="32x32" type="image/png"/>
<link href="{{ site.Data.copy._default_baseof.copy_href_images_favicon_favicon_16x16_png }}" rel="icon" sizes="16x16" type="image/png"/>
<link href="{{ site.Data.copy._default_baseof.copy_href_images_favicon_site_webmanifest }}" rel="manifest"/>
  {{ $css := resources.Get "css/style.css" | minify | fingerprint }}
  <link href="{{ $css.RelPermalink }}" rel="stylesheet"/>
</head>
<body>
  {{ partial "header.html" . }}
  <main class="container">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <script async="" data-goatcounter="https://ymatterlab.goatcounter.com/count" src="https://gc.zgo.at/count.js"></script>
<script>
  (function () {
    const countElement = document.querySelector("[data-goatcounter-total]");

    if (!countElement) {
      return;
    }

    fetch("https://ymatterlab.goatcounter.com/counter/TOTAL.json")
      .then(function (response) {
        if (!response.ok) {
          throw new Error("GoatCounter total is not available");
        }

        return response.json();
      })
      .then(function (data) {
        countElement.textContent = data.count || "0";
      })
      .catch(function () {
        countElement.textContent = "unavailable";
      });
  }());
  </script>
</body>
</html>
