# Pages CMS edits main by default; a save on main goes live immediately, so use
# it for small maintainer edits only. Larger edits use a branch and pull request.
# LOCKED: data/research_lines.yaml is omitted entirely (including names/order).
# Publications/DOIs/cache are omitted: CI and production builds stay offline.
# merge:true preserves unmanaged front matter, anchor maps and locked copy fields.
media:
  input: static/images
  output: /images
  categories:
  - image
settings:
  content:
    merge: true
  commit:
    templates:
      create: 'content: add {path}'
      update: 'content: update {path}'
      delete: 'content: delete {path}'
      rename: 'content: rename {oldPath} to {newPath}'
content:
# News submissions use the GitHub issue form; news authoring is omitted here.
