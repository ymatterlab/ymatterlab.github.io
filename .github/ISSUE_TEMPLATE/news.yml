name: Submit news
description: Send a news item to Yuewen for review and publication.
title: "News: "
body:
  - type: markdown
    attributes:
      value: |
        **Title:** use `News: [short headline]`, for example `News: New PhD student joins Y-Matter Lab`.
        Fill in the required date, category, and news text below. Edit the example news text directly to describe your own news.
        Source links and images are optional; leave those fields empty if they do not apply.
        Yuewen will review and publish the news. This request and any attachments are public.
  - type: input
    id: date
    attributes:
      label: Event date
      description: "Date of the event, publication, or award. Format: YYYY-MM-DD (four-digit year, two-digit month and day), for example 2026-11-14."
      placeholder: "2026-11-14"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Choose one category from the list; no need to type a category name.
      options:
        - announcements (new members, positions, talks, visits, events)
        - honors (awards, grants, fellowships)
        - output (papers, preprints, software, datasets)
        - life (defenses, group outings, celebrations)
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: News text
      description: Edit the example below to describe your news in one to three sentences. Replace the name, role or achievement, journal or organization, and date as needed.
      value: |
        Since August 2026, Yue-Wen Fang has served as an Associate Editor of Physica B: Condensed Matter.
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Source link (optional)
      description: "Paste a full URL starting with https:// (not a bare DOI). For a paper, use https://doi.org/[DOI]; otherwise link to the award announcement or event page."
      placeholder: "https://doi.org/10.1126/science.abm5134"
  - type: textarea
    id: image
    attributes:
      label: Image (optional)
      description: Attach an image, then add the details below. Use a group-owned WebP or JPEG up to 1600 pixels wide. For a research figure, cite the source paper and DOI.
      placeholder: |
        [Drag or paste your image here]
        Description: [One sentence describing what is visible, including names if relevant]
        Caption / credit: [Caption and image credit; for a research figure, paper citation and https://doi.org/...]
  - type: checkboxes
    id: checks
    attributes:
      label: Ready to submit
      options:
        - label: This news is ready to share publicly, and I have permission to share any attached images (including consent from people pictured).
          required: true
