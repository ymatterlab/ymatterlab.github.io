name: Submit news
description: Send a news item to Yuewen for review and publication.
title: "News: "
body:
  - type: markdown
    attributes:
      value: |
        Use the title above as your news headline, then fill in the fields below.
        Yuewen will review and publish the news. This request and any attachments are public.
  - type: input
    id: date
    attributes:
      label: Event date
      description: When did the news happen? Use YYYY-MM-DD.
      placeholder: "2026-11-14"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Choose the best match.
      options:
        - announcements (new members, positions, talks, visits, events)
        - honors (awards, grants, fellowships)
        - output (papers, preprints, software, datasets)
        - life (defenses, group outings, celebrations)
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: News text
      description: One to three sentences. Include the full names of the people involved.
      placeholder: "What happened, who was involved, and why does it matter?"
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Source link (optional)
      description: Link to the paper's DOI, award announcement, or event page, if available.
      placeholder: "https://doi.org/..."
  - type: textarea
    id: image
    attributes:
      label: Image (optional)
      description: Attach an image and describe what it shows. For a research figure, include the paper and DOI.
  - type: checkboxes
    id: checks
    attributes:
      label: Ready to submit
      options:
        - label: This news is ready to share publicly, and I have permission to share any attached images (including consent from people pictured).
          required: true
