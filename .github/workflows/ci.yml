name: Validate pull request
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.128.0
      HUGO_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo CLI
        run: |
          wget -O "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild publications from cache
        run: |
          pip install pyyaml
          python scripts/build_pubs.py --offline
      - name: Build website
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: hugo --minify
      - name: Check internal links, semantics and locked research text
        run: python scripts/check_site.py public
      - name: Upload branch preview
        uses: actions/upload-artifact@v4
        with:
          name: built-website
          path: public/
          retention-days: 14
          if-no-files-found: error
