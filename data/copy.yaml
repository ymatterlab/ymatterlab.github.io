  copy_y_matter_lab_studies_how_atomic_structure_electronic_states_magne: Y-Matter Lab studies how atomic
    structure, electronic states, magnetism, lattice dynamics, defects, and interfaces give rise to useful
    material properties. We combine first-principles calculations, atomistic simulations, and machine
    learning to understand existing materials and identify promising new candidates.
