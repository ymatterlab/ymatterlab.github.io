  copy_students_can_build_skills_in_quantum_mechanical_materials_modelin: Students can build skills in
    quantum-mechanical materials modeling, scientific programming, data analysis, machine learning, and
    physical interpretation. Projects are often collaborative, with room to move from careful mechanism-building
    to exploratory materials discovery.
  copy_contact_the_lab: Contact the Lab
  tool_categories:
  - title: Ab initio codes
    text: Density functional theory with VASP and Quantum ESPRESSO, plus WIEN2k and Elk for all-electron
      calculations. Phonons and thermal transport with phonopy and phono3py. Electron–phonon superconductivity
      with EPW, Migdal–Eliashberg theory, and superconducting DFT. Quantum transport with DFT plus non-equilibrium
      Green’s functions (QuantumATK), and chemical bonding with LOBSTER.
    items:
    - '<a href="https://sscha.eu/" rel="noopener" target="_blank"><strong>SSCHA</strong></a> <span class="tool-badge">we
      contribute</span>

      <span>The stochastic self-consistent harmonic approximation, for ionic quantum and anharmonic effects
      on structure, phonons, and superconductivity.</span>'
    - "<strong>OSEP</strong> <span class=\"tool-badge\">we contribute</span>\n<span>The orbital selective\
      \ external potential method, which shifts selected orbitals to switch off specific hybridizations\
      \ and identify the mechanism behind a property, such as lone-pair-driven ferroelectricity or magnetic\
      \ anisotropy\n                (<a href=\"https://doi.org/10.1007/s11434-014-0628-4\" rel=\"noopener\"\
      \ target=\"_blank\">review</a>,\n                <a href=\"https://doi.org/10.1002/adts.201900029\"\
      \ rel=\"noopener\" target=\"_blank\">lone pairs</a>,\n                <a href=\"https://doi.org/10.1016/j.physe.2020.114424\"\
      \ rel=\"noopener\" target=\"_blank\">magnetic anisotropy</a>).</span>"
  - title: Crystal structure prediction
    text: Global structure searches with CALYPSO, CrySPY, USPEX, MAGUS, minima hopping, and genetic algorithms,
      used to find ground states of new compounds, phases under pressure, and substituted or defective
      structures.
    items:
    - "<strong>Anharmonic structure prediction</strong>\n<span>Iterative-learning searches that rank candidates\
      \ by their SSCHA free energy, so that quantum and anharmonic effects enter the phase diagram\n \
      \               (<a href=\"https://doi.org/10.1103/fcrd-8zzf\" rel=\"noopener\" target=\"_blank\"\
      >Phys. Rev. B 2026</a>).</span>"
  - title: Computational workflow
    text: High-throughput workflows that screen databases of 10<sup>5</sup>–10<sup>6</sup> compounds,
      built on pymatgen and ASE, and run on supercomputers including the EuroHPC system LUMI and the DIPC
      Supercomputing Center.
    items:
    - "<a href=\"https://github.com/Quantum-Accelerators/quacc\" rel=\"noopener\" target=\"_blank\"><strong>QuAcc</strong></a>\
      \ <span class=\"tool-badge\">we contribute</span>\n<span>The Quantum Accelerator, a workflow library\
      \ for high-throughput atomistic simulations\n                (<a href=\"https://doi.org/10.48550/arXiv.2609.33823\"\
      \ rel=\"noopener\" target=\"_blank\">paper</a>).</span>"
    - '<a href="https://github.com/SMTG-Bham/sumo" rel="noopener" target="_blank"><strong>sumo</strong></a>
      <span class="tool-badge">we contribute</span>

      <span>A toolkit for analysing and plotting results of ab initio calculations, such as band structures,
      densities of states, and phonons.</span>'
  - title: Machine learning
    text: We use machine learning both to predict properties and to design materials, and we train interatomic
      potentials that make expensive simulations affordable.
    items:
    - '<strong>Forward prediction</strong>

      <span>Models that map composition and structure to properties for fast screening, such as graph
      neural networks (ALIGNN) that predict electron–phonon coupling and T<sub>c</sub> across large materials
      databases.</span>'
    - '<strong>Inverse design</strong>

      <span>Working backwards from a target property to candidate compositions and structures, which are
      then checked with <em>ab initio</em> calculations and, with collaborators, in experiment.</span>'
    - '<strong>Training MLIPs</strong>

      <span>Machine-learning interatomic potentials trained on DFT data, from moment tensor potentials
      to fine-tuned atomistic foundation models such as MatterSim, used for SSCHA calculations, molecular
      dynamics, and large structure searches.</span>'
  methods_intro: We combine first-principles and atomistic simulations with materials informatics to connect
    composition and structure with stability, transport, phase transitions, and functional response. Working
    with experimental collaborators, we use these calculations to interpret measurements, test mechanisms,
    and suggest new compositions, strain states, defects, interfaces, and growth conditions.
  tools_note: Tools tagged <span class="tool-badge">we contribute</span> are codes and methods our group
    has helped develop.
