- id: information-materials
  number: '02'
  title: Information Materials
  summary: We investigate ferroelectric, ferromagnetic, piezoelectric, and multiferroic materials for
    electronics and spintronics. Much of this work focuses on how polarization, magnetism, defects, and
    interfaces can be controlled.
  bullets:
  - Ferroelectric switching, tunnel junctions, and photovoltaic response.
  - Multiferroics, magnetoelectric coupling, and magnetic anisotropy.
  - Complex oxide thin films, heterostructures, vacancies, and interfacial reconstruction.
  questions_title: Key questions
  questions:
  - How thin can a ferroelectric become and still switch reliably?
  - How do defects, chemical substitution, and interfaces control polarization, magnetism, and their coupling?
  - Which material designs lead to multi-level, low-power memory and optoelectronic devices?
  themes:
  - title: Atomic-scale ferroelectrics and tunnel junctions
    text: Much of this work is done with experimental groups who grow and measure thin films, while we
      build first-principles models of structure, polarization, and electronic states. In Sm-substituted
      layered bismuth oxide, a ferroelectric hysteresis loop is observed down to about 1 nm, and first-principles
      calculations point to a lone-pair-driven ferroelectric. Tunnel junctions built on this material
      keep a tunnelling electroresistance of 7 × 10<sup>5</sup> at 1 nm thickness and support up to 32
      resistance states. Our DFT+U calculations of the interface show how switching the polarization turns
      the interfacial layers of the Nb:SrTiO<sub>3</sub> electrode between metallic and insulating, which
      explains the large resistance contrast.
  - title: Chemical design of ferroic films
    text: Inequivalent cation substitution, oxygen vacancies, and anion (sulfur) substitution are used
      to tune polarization, band gap, and magnetic order. Examples include enhanced ferroelectric photovoltaic
      responses in double-perovskite films, robust ferroelectricity through polarization rotation in sulfurized
      BiFeO<sub>3</sub>, and stronger magnetic ordering in super-tetragonal BiFeO<sub>3</sub>.
  - title: Theory-led device concepts
    text: On the theory side, we have proposed a monolayer two-dimensional ferroelectric tunnel junction
      based on doped SnSe, and predicted robust ferroelectricity in the nitride perovskite LaWN<sub>3</sub>.
