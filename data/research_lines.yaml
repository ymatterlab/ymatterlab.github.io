- id: quantum-materials
  number: '01'
  title: Quantum Materials
  summary: We study superconductors, hydrides, two-dimensional systems, polar metals, magnetic materials,
    and oxide interfaces where electronic, structural, magnetic, and vibrational degrees of freedom are
    strongly coupled.
  bullets:
  - Electron-phonon coupling, anharmonicity, and superconductivity.
  - Pressure, strain, dimensionality, and chemical tuning of quantum phases.
  - Microscopic mechanisms behind emergent electronic and magnetic responses.
  questions_title: Key questions
  questions:
  - Can conventional superconductors reach high T<sub>c</sub> without extreme pressure, and which chemistries
    make this possible?
  - How does quantum nuclear motion change stability and pairing in light-element compounds?
  - Which new electronic phases appear at oxide interfaces, or when polarity coexists with metallicity?
  themes:
  - title: Hydride superconductors at ambient pressure
    text: 'A central theme is conventional, phonon-mediated superconductivity in hydrides at or near ambient
      pressure. With collaborators, we combine machine learning with high-throughput <em>ab initio</em>
      calculations to map large materials spaces: one search of more than 150 000 compounds found about
      50 hydrides with predicted T<sub>c</sub> above 20 K. Screening the thermodynamically stable cubic
      hydrides of the GNoME database, we identified 25 superconductors with T<sub>c</sub> above 4.2 K,
      the highest being 17 K in LiZrH<sub>6</sub>Ru. We also test claims critically: our crystal structure
      searches for the Lu–N–H system find no stable phase with high-temperature superconductivity near
      ambient pressure.'
  - title: Quantum anharmonic effects
    text: High-throughput screens usually work in the harmonic approximation. Because hydrogen is so light,
      ionic quantum and anharmonic effects can change both dynamical stability and T<sub>c</sub>. Including
      them, we predict that RbPH<sub>3</sub> is thermodynamically stable at about 30 GPa in a perovskite
      structure and stays dynamically stable down to ambient pressure, with a predicted T<sub>c</sub>
      around 100 K. We treat these effects with the stochastic self-consistent harmonic approximation
      (SSCHA), accelerated by machine-learned interatomic potentials, for example in LaBeH<sub>8</sub>
      and metal-stuffed B–C clathrates, and we are building crystal structure prediction schemes that
      include anharmonic lattice dynamics.
  - title: Polar metals and oxide interfaces
    text: We design polar metals such as BiPbTi<sub>2</sub>O<sub>6</sub>, in which polar displacements
      coexist with metallic conduction and can be switched through interfacial coupling to a ferroelectric.
      We also study emergent magnetism and Berry-curvature effects at oxide interfaces.
