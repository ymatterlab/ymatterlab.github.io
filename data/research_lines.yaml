- id: energy-materials
  number: '03'
  title: Energy Materials
  summary: We use theory and simulation to explore materials for thermoelectric conversion, catalysis,
    energy storage, and energy harvesting. A central theme is the relation between local structure, lattice
    dynamics, transport, and functional response.
  bullets:
  - Thermoelectrics with low thermal conductivity and favorable electronic structure.
  - Negative thermal expansion and thermal transport controlled by phonons.
  - Polar, defective, surface, and interface effects in energy-related processes.
  questions_title: Key questions
  questions:
  - Which bonding, band-structure, and phonon features give low thermal conductivity and high thermoelectric
    efficiency?
  - Which local structures and lattice dynamics drive negative or near-zero thermal expansion, and can
    it be combined with low thermal conductivity?
  - How can polarization and surfaces be used to boost catalytic activity?
  themes:
  - title: Thermal transport and thermoelectrics
    text: We connect chemical bonding and lattice dynamics with heat flow. In the PbSe/PbTe monolayer
      heterostructure, weak, polar-covalent Pb–Se and Pb–Te bonds with occupied antibonding states lead
      to ultralow lattice thermal conductivity, which we compute including three- and four-phonon scattering.
      With experimental groups, we have also studied band engineering in bulk thermoelectrics, such as
      the alignment of nested conduction bands in Pb<sub>7</sub>Bi<sub>4</sub>Se<sub>13</sub> and triple
      doping in Cu<sub>2</sub>SnSe<sub>3</sub>.
  - title: Anomalous thermal expansion
    text: In Cd<sub>2</sub>Re<sub>2</sub>O<sub>7</sub>-based oxides, synchrotron measurements and phonon
      calculations together show that soft acoustic phonons with large negative Grüneisen parameters,
      along with locally ordered Re–Re dimers, give both negative or zero thermal expansion and ultralow
      thermal conductivity (0.38–0.56 W m<sup>−1</sup> K<sup>−1</sup>). In PbTiO<sub>3</sub>-based ferroelectrics,
      we have studied how mixed anions such as sulfur enhance negative thermal expansion.
  - title: Polarization-enhanced catalysis
    text: Our DFT+U calculations show that hydroxyl groups adsorbed on BiFeO<sub>3</sub> reverse its surface
      polarization and lower the free-energy cost of hydrogen and oxygen evolution. The computed OER overpotential
      drops from 0.81 to 0.64 V, consistent with the lower overpotential measured after electrolysis on
      BiFeO<sub>3</sub>/nickel-foam electrodes.
